# Redis configuration file with ACL users

# ============================================
# NETWORK
# ============================================
bind 0.0.0.0
port 6379
protected-mode yes

# ============================================
# ACL CONFIGURATION
# ============================================

# Путь к файлу с пользователями ACL
# Если указан, Redis загрузит пользователей из этого файла
aclfile /usr/local/etc/redis/users.acl

# Или можно определить пользователей прямо здесь:

# Default user (для обратной совместимости)
# Отключаем default user для безопасности
user default off nopass ~* &* +@all

# Admin пользователь - полные права
user admin on >AdminStrongPass123! ~* &* +@all

# Read-only пользователь
user readonly on >ReadOnlyPass456! ~* &* +@read +@connection -@write -@dangerous

# Cache writer - только для работы с кешем
user cache_writer on >CachePass789! ~cache:* &* +get +set +setex +del +expire +ttl +ping

# Application user - доступ к определенным ключам
user app_user on >AppUserPass999! ~app:* ~session:* &* +@all -@admin -@dangerous

# Monitoring user - только для мониторинга
user monitor on >MonitorPass111! ~* &* +@read +@connection +info +ping +client +config|get

# Pub/Sub user - только для сообщений
user pubsub_user on >PubSubPass222! &channel:* +@pubsub +@connection

# ============================================
# TCP
# ============================================
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ============================================
# LOGGING
# ============================================
loglevel notice
logfile ""

# ============================================
# DATABASES
# ============================================
databases 16

# ============================================
# PERSISTENCE - RDB
# ============================================
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ============================================
# PERSISTENCE - AOF
# ============================================
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================
# SECURITY
# ============================================

# Отключаем опасные команды для всех (кроме admin через переименование)
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ADMIN_CONFIG_CMD_xyz123

# ============================================
# MEMORY
# ============================================
# maxmemory 2gb
# maxmemory-policy allkeys-lru
